spring:
  application:
    name: repetitio
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-period: 1m

security:
  jwt:
    issuer: ${JWT_ISSUER:repetitio}
    audience: ${JWT_AUDIENCE:repetitio-api}
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
