services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: repetitio
      POSTGRES_USER: repetitio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U repetitio -d repetitio" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: